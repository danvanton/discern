name: Release

# A version tag (v0.1.0) publishes a release:
#   1. the CI checks;
#   2. the image for amd64 and arm64, pushed to GHCR with an SBOM and
#      provenance, then signed with cosign (keyless);
#   3. a GitHub release with generated notes, the image digest, and the
#      makemkv-oss source the image was built from.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      skip-image: true # the image job below builds it
    permissions:
      contents: read

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless: GitHub's OIDC token identifies this workflow as the signer
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU runs the arm64 stages (apt and the makemkv-oss compile) on this
      # amd64 runner. The Go binary is cross-compiled and needs no emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: 0.1.0, 0.1 and latest. The image name is made lowercase, as
      # GHCR requires.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # No build cache: releases are rare, and a fresh build means nothing
      # from an earlier run ends up in a published image.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Signing the digest covers both platforms and every tag pointing at it.
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image contains compiled makemkv-oss libraries (LGPL), so their
      # source is published next to it: the same tarball, checked against
      # the same pin the image build used.
      - name: Fetch the makemkv-oss source
        run: |
          set -eu
          . internal/makemkv/install/pin.env
          f=$(sh scripts/fetch-makemkv-oss.sh internal/makemkv/install/pin.env)
          echo "OSS_TARBALL=$f" >> "$GITHUB_ENV"
          echo "MAKEMKV_VERSION=$MAKEMKV_VERSION" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -eu
          image="ghcr.io/${REPO,,}"
          cat > notes.md <<EOF
          Image: \`${image}:${TAG#v}\` (digest \`${DIGEST}\`), for linux/amd64 and linux/arm64. It installs MakeMKV ${MAKEMKV_VERSION} at first start.

          Check the signature:

          \`\`\`sh
          cosign verify ${image}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          \`${OSS_TARBALL}\` is the makemkv-oss source the image's MakeMKV libraries were built from.
          EOF
          gh release create "$TAG" --verify-tag --generate-notes --notes-file notes.md "$OSS_TARBALL"
